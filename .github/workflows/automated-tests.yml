name: Automated Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile automated tests
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Run automated tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend tests
        run: dotnet restore SkillSwap.Tests/SkillSwap.Tests.csproj --configfile NuGet.Config

      - name: Run backend automated tests
        run: dotnet test SkillSwap.Tests/SkillSwap.Tests.csproj --no-restore --configuration Release
