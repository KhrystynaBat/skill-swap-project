name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  version:
    name: Versioning
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_version.outputs.VERSION }}

    steps:
      - name: Generate version
        id: set_version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"


  frontend-tests:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    needs: version

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Display Node versions
        run: |
          node -v
          npm -v

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

      - name: Compile automated tests
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Run unit tests with coverage
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
        if: ${{ always() }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

      - name: Build info
        run: |
          echo "Version: ${{ needs.version.outputs.version }}" > build-info.txt
          echo "Build time: $(date -u)" >> build-info.txt
          echo "Node version: $(node -v)" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          cat build-info.txt

      - name: Upload frontend build report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-report
          path: frontend/build-info.txt
        if: ${{ always() }}


  backend-tests:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    needs: version

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Display .NET version
        run: dotnet --version

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --configuration Release

      - name: Run backend tests with coverage
        run: dotnet test \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger trx \
          --results-directory TestResults

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Html

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage-report
        if: ${{ always() }}

      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults
        if: ${{ always() }}

      - name: Build info
        run: |
          echo "Version: ${{ needs.version.outputs.version }}" > build-info.txt
          echo "Build time: $(date -u)" >> build-info.txt
          echo "Dotnet version: $(dotnet --version)" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          cat build-info.txt

      - name: Upload backend build report
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-report
          path: backend/build-info.txt
        if: ${{ always() }}


  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, version]

    steps:
      - name: CI Success
        run: |
          echo "All checks passed"
          echo "Version: ${{ needs.version.outputs.version }}"