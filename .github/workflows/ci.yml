name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  version:
    name: Versioning
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_version.outputs.VERSION }}

    steps:
      - name: Generate version
        id: set_version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT


  frontend-tests:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    needs: version

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --configuration production
      - run: npx tsc -p tsconfig.spec.json --noEmit
      - run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
        if: ${{ always() }}

      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui


  backend-tests:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    needs: version

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory TestResults

      - run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage
        run: |
          reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Html

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage-report
        if: ${{ always() }}


  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, version]

    steps:
      - name: Generate build report
        run: |
          echo "Version: ${{ needs.version.outputs.version }}" > build-info.txt
          echo "Build time: $(date -u)" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          echo "Frontend: OK" >> build-info.txt
          echo "Backend: OK" >> build-info.txt
          cat build-info.txt

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-info.txt

      - name: Done
        run: echo "CI passed"
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy backend to Render
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend to Render
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

      - name: Deployment completed
        run: echo "Deployment to staging triggered successfully"