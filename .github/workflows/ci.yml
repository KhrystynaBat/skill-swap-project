name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  # LINT FRONTEND
  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint


  # LINT BACKEND
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes


  # BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]

    steps:
      - uses: actions/checkout@v4

      # Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run build -- --configuration production

      # Backend
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: cd backend && dotnet restore
      - run: cd backend && dotnet build --no-restore --configuration Release

      - name: Create build report
        run: |
          echo "Build number: ${{ github.run_number }}" > build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt


  # FRONTEND TESTS
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Unit tests + coverage
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
        if: ${{ always() }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui


  # BACKEND TESTS
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore

      - name: Run tests + coverage
        run: |
          dotnet test SkillSwap.Tests/SkillSwap.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory TestResults

      - run: dotnet tool restore

      - name: Generate coverage
        run: |
          dotnet tool run reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Html

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-report
        if: ${{ always() }}

  version:
    name: Semantic Versioning
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests] 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release


  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [version]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy backend to Staging
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_STAGING }}"

      - name: Deploy frontend to Staging
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_STAGING }}"

      - name: Wait for Render deployment
        run: sleep 90

      - name: Health check backend staging
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if curl -f -w "\nStatus: %{http_code} | Time: %{time_total}s\n" \
               https://skill-swap-project-staging.onrender.com/health; then
              echo "Backend staging is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "All health checks failed!"
          exit 1

      - name: Health check frontend staging
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if curl -f -w "\nStatus: %{http_code} | Time: %{time_total}s\n" \
               https://skillswap-frontend-staging.onrender.com; then
              echo "Frontend staging is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "All health checks failed!"
          exit 1

      - name: Deployment to staging completed
        run: echo "Deployment to staging completed and verified successfully"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy backend to Production
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend to Production
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

      - name: Wait for Render deployment
        run: sleep 90

      - name: Health check backend with rollback
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if curl -f -w "\nStatus: %{http_code} | Time: %{time_total}s\n" \
               https://skill-swap-project-lipk.onrender.com/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Backend health check failed! Triggering rollback..."
          DEPLOYS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys?limit=2")
          PREVIOUS_DEPLOY_ID=$(echo $DEPLOYS | python3 -c "
          import sys, json
          deploys = json.load(sys.stdin)
          print(deploys[1]['deploy']['id'])
          ")
          echo "Rolling back to deploy: $PREVIOUS_DEPLOY_ID"
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys/$PREVIOUS_DEPLOY_ID/rollback"
          echo "Rollback triggered for backend"
          exit 1

      - name: Health check frontend with rollback
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if curl -f -w "\nStatus: %{http_code} | Time: %{time_total}s\n" \
               https://skillswap-frontend-rzb6.onrender.com; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Frontend health check failed! Triggering rollback..."
          DEPLOYS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys?limit=2")
          PREVIOUS_DEPLOY_ID=$(echo $DEPLOYS | python3 -c "
          import sys, json
          deploys = json.load(sys.stdin)
          print(deploys[1]['deploy']['id'])
          ")
          echo "Rolling back to deploy: $PREVIOUS_DEPLOY_ID"
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys/$PREVIOUS_DEPLOY_ID/rollback"
          echo "Rollback triggered for frontend"
          exit 1

      - name: Deployment to production completed
        run: echo "Deployment to production completed and verified successfully"
