<div class="matches-page">
    <div class="matches-card">

        <h1>Your Matches</h1>

        <div *ngIf="isLoading">Loading...</div>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <div class="matches-list" *ngIf="!isLoading && matches.length">

            <div class="match-card" *ngFor="let match of matches">

                <div class="match-info">
                    <div class="user-block" *ngIf="usersMap[getOtherUserId(match)] as user">

                        <div class="avatar">
                            <img *ngIf="user.avatarUrl; else defaultAvatar" [src]="user.avatarUrl" />

                            <ng-template #defaultAvatar>
                                <div class="avatar-placeholder">
                                    {{ user.name?.charAt(0) }}
                                </div>
                            </ng-template>
                        </div>

                        <div class="user-info">
                            <p class="user-name">{{ user.name }}</p>
                            <p class="city">{{ user.city || 'City not specified' }}</p>
                        </div>

                    </div>

                    <!-- STATUS -->
                    <div class="status">

                        <!-- INCOMING -->
                        <ng-container *ngIf="match.status === 'pending' && isIncoming(match)">
                            <span class="incoming-text">Wants to match with you</span>
                        </ng-container>

                        <!-- OUTGOING -->
                        <ng-container *ngIf="match.status === 'pending' && isOutgoing(match)">
                            <span class="waiting-text">Waiting for response</span>
                        </ng-container>

                        <!-- ACTIVE -->
                        <ng-container *ngIf="match.status === 'active'">
                            <span class="active-text">Matched ✔</span>
                        </ng-container>

                        <!-- REJECTED -->
                        <ng-container *ngIf="match.status === 'rejected'">
                            <span class="rejected-text">Rejected</span>
                        </ng-container>

                        <!-- COMPLETED -->
                        <ng-container *ngIf="match.status === 'completed'">
                            <span class="completed-text">Completed</span>
                        </ng-container>

                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="match-actions">

                    <!-- INCOMING -->
                    <ng-container *ngIf="match.status === 'pending' && isIncoming(match)">
                        <button class="accept-btn" (click)="acceptMatch(match)"
                            [disabled]="loadingMatchId === match.id">
                            {{ loadingMatchId === match.id ? 'Accepting...' : 'Accept' }}
                        </button>
                        <button class="reject-btn" (click)="rejectMatch(match.id)"
                            [disabled]="loadingMatchId === match.id">
                            {{ loadingMatchId === match.id ? 'Rejecting...' : 'Reject' }}
                        </button>
                    </ng-container>

                    <!-- OUTGOING -->
                    <span *ngIf="match.status === 'pending' && isOutgoing(match)" class="waiting-label">
                        ⏳ Requested
                    </span>

                    <!-- ACTIVE -->
                    <ng-container *ngIf="match.status === 'active'">
                        <button class="primary-btn" [routerLink]="['/chat', getOtherUserId(match)]">Message</button>
                        <button class="finish-btn" (click)="openFinishMatch(match)">
                            Finish match
                        </button>
                    </ng-container>

                </div>

                <form class="finish-form" *ngIf="reviewMatchId === match.id" (ngSubmit)="submitReview(match)">
                    <label for="rating-{{ match.id }}">Rating</label>
                    <select id="rating-{{ match.id }}" name="rating-{{ match.id }}" [(ngModel)]="reviewRating">
                        <option [ngValue]="5">5 - Excellent</option>
                        <option [ngValue]="4">4 - Good</option>
                        <option [ngValue]="3">3 - Okay</option>
                        <option [ngValue]="2">2 - Poor</option>
                        <option [ngValue]="1">1 - Bad</option>
                    </select>

                    <label for="comment-{{ match.id }}">Comment</label>
                    <textarea id="comment-{{ match.id }}" name="comment-{{ match.id }}" [(ngModel)]="reviewComment"
                        placeholder="Write a short review..."></textarea>

                    <div class="finish-actions">
                        <button class="accept-btn" type="submit" [disabled]="loadingMatchId === match.id">
                            {{ loadingMatchId === match.id ? 'Saving...' : 'Save review' }}
                        </button>
                        <button class="reject-btn" type="button" (click)="cancelFinishMatch()"
                            [disabled]="loadingMatchId === match.id">
                            Cancel
                        </button>
                    </div>

                    <p class="review-error" *ngIf="reviewMessage">{{ reviewMessage }}</p>
                </form>


            </div>

        </div>

        <p *ngIf="!isLoading && matches.length === 0">
            No matches yet
        </p>

    </div>
</div>
