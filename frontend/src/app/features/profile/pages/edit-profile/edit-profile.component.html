<div class="edit-profile-page">
    <div class="edit-profile-card" *ngIf="!isLoading; else loadingBlock">

        <div class="header-row">
            <h1>Edit Profile</h1>
            <button type="button" class="secondary-btn" (click)="goBack()">Back</button>
        </div>

        <form *ngIf="editProfileForm" [formGroup]="editProfileForm" (ngSubmit)="onSubmit()">

            <div class="top-section">

                <div class="avatar-block">

                    <div class="avatar-preview" *ngIf="editProfileForm.value.avatarUrl; else placeholder">
                        <img [src]="editProfileForm.value.avatarUrl || ''" alt="Avatar preview" />
                    </div>

                    <ng-template #placeholder>
                        <div class="avatar-placeholder">
                            {{ editProfileForm.value.name?.charAt(0) || 'U' }}
                        </div>
                    </ng-template>

                    <!-- <div class="form-group">
                        <label for="avatarFile">Upload photo</label>
                        <input id="avatarFile" type="file" accept="image/*" (change)="onFileSelected($event)" />
                    </div> -->
                    <label class="upload-btn">
                        Upload photo
                        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
                    </label>

                </div>

                <div class="main-info">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" type="text" formControlName="name" />
                        <small *ngIf="editProfileForm.controls.name.touched && editProfileForm.controls.name.invalid">
                            The name must contain at least 2 characters.
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input id="city" type="text" formControlName="city" />
                    </div>

                </div>

            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="4" formControlName="bio"></textarea>
            </div>

            <!-- <div class="form-group">
                <label for="avatarUrl">Avatar URL</label>
                <input id="avatarUrl" type="text" formControlName="avatarUrl" />
            </div> -->

            <div class="messages">
                <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
                <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
            </div>

            <div class="actions">
                <button type="button" class="secondary-btn" (click)="goBack()">Cancel</button>
                <button type="submit" class="primary-btn" [disabled]="isSaving">
                    {{ isSaving ? 'Saving...' : 'Save changes' }}
                </button>
            </div>

        </form>
    </div>

    <ng-template #loadingBlock>
        <div class="edit-profile-card">
            <p>Loading profile data...</p>
        </div>
    </ng-template>
</div>
